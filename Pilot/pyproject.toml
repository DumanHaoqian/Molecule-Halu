[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "molhallulens"
version = "0.2.0"
description = "Configurable multi-point hallucination dataset builder for molecular editing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "MolHalluLens contributors" }]
dependencies = [
  "fastapi-poe==0.0.83",
  "gradio==6.26.0",
  "rdkit==2025.9.6",
  "tiktoken==0.12.0",
]

[project.scripts]
molhallulens-build-subset = "molhallulens.modules.ingestion.build_subset:main"
molhallulens-demo = "molhallulens.demo:main"
molhallulens-generate = "molhallulens.generate_dataset:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["molhallulens*"]

[tool.setuptools.package-data]
molhallulens = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
