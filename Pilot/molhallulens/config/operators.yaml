schema_version: "1.0"
policies: [LOCAL, PARTIAL, FULL_CF, TERMINAL]

families:
  wrong_anchor_site:
    supported_policies: [LOCAL, PARTIAL, FULL_CF]
    allowed_candidate_sources: [RULE, RDKIT, LLM, HYBRID]
  wrong_fragment_group:
    supported_policies: [LOCAL, PARTIAL, FULL_CF]
    allowed_candidate_sources: [RULE, RDKIT, LLM, HYBRID]
  attachment_bond_edit:
    supported_policies: [LOCAL, PARTIAL, FULL_CF]
    allowed_candidate_sources: [RULE, RDKIT, LLM, HYBRID]
  numeric_count_claim:
    supported_policies: [LOCAL, PARTIAL]
    allowed_candidate_sources: [RULE, RDKIT, HYBRID]
  nl_formal_internal_relation:
    supported_policies: [LOCAL, PARTIAL]
    allowed_candidate_sources: [RULE, LLM, HYBRID]
  final_answer_identity:
    supported_policies: [TERMINAL]
    allowed_candidate_sources: [RULE, RDKIT, LLM, HYBRID]

quota_bucket_mappings:
  anchor_site_grounding: [wrong_anchor_site]
  group_fragment_identity: [wrong_fragment_group]
  attachment_internal_relation: [attachment_bond_edit, nl_formal_internal_relation]
  heavy_ring_count_claim: [numeric_count_claim]
  entity_partial_propagation: [wrong_anchor_site, wrong_fragment_group, attachment_bond_edit]
  product_dependency_cross_step: [wrong_anchor_site, wrong_fragment_group, attachment_bond_edit]
  count_ring_propagation: [numeric_count_claim]
  nl_formal_internal_relation: [nl_formal_internal_relation]
  valid_wrong_site_occurrence_regioisomer: [wrong_anchor_site]
  valid_wrong_group_fragment: [wrong_fragment_group]
  wrong_attachment_atom_bond: [attachment_bond_edit]
  alternate_valid_edit_boundary: [wrong_anchor_site, wrong_fragment_group, attachment_bond_edit]
  terminal_valid_high_similarity: [final_answer_identity]
  terminal_stereo_connectivity_regio: [final_answer_identity]
  terminal_invalid_format_diagnostic: [final_answer_identity]

quotas_per_subtask_policy:
  LOCAL:
    - {family: anchor_site_grounding, target_per_50: 15}
    - {family: group_fragment_identity, target_per_50: 15}
    - {family: attachment_internal_relation, target_per_50: 10}
    - {family: heavy_ring_count_claim, target_per_50: 10}
  PARTIAL:
    - {family: entity_partial_propagation, target_per_50: 18}
    - {family: product_dependency_cross_step, target_per_50: 17}
    - {family: count_ring_propagation, target_per_50: 10}
    - {family: nl_formal_internal_relation, target_per_50: 5}
  FULL_CF:
    - {family: valid_wrong_site_occurrence_regioisomer, target_per_50: 18}
    - {family: valid_wrong_group_fragment, target_per_50: 15}
    - {family: wrong_attachment_atom_bond, target_per_50: 10}
    - {family: alternate_valid_edit_boundary, target_per_50: 7}
  TERMINAL:
    - {family: terminal_valid_high_similarity, target_per_50: 35}
    - {family: terminal_stereo_connectivity_regio, target_per_50: 10}
    - {family: terminal_invalid_format_diagnostic, target_per_50: 5}

candidate_generation:
  target_mix_percent: {RULE_RDKIT: 40, LLM: 40, HYBRID: 20}
  candidates_per_recipe_min: 3
  candidates_per_recipe_max: 10
  minimum_valid_structural_h_percent: 80
  minimum_llm_structural_participation_percent: 50
  accept_first_passing_candidate: false

fallback:
  within_operator_family_first: true
  same_policy_only: true
  record_quota_deviation: true
  prohibit_silent_phenotype_change: true
